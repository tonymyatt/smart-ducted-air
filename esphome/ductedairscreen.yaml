########################
# Audio config
########################

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO${i2s_lrclk_pin}
    i2s_bclk_pin: GPIO${i2s_bclk_pin}
    i2s_mclk_pin: GPIO${i2s_mclk_pin}

audio_dac:
  - platform: es8311
    i2c_id: bus
    id: es8311_dac
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_dout_pin: GPIO${i2s_dout_pin}
    dac_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    audio_dac: es8311_dac
    buffer_duration: 100ms

########################
# Display and touchscreen
########################

display:
  - platform: mipi_spi
    model: ili9341
    dc_pin: GPIO46
    cs_pin: GPIO10
    invert_colors: true
    dimensions:
      width: 240
      height: 320
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: ft63x6
    interrupt_pin: GPIO17
    on_touch:
    # Log out each touch event
    - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
              touch.x,
              touch.y,
              touch.x_raw,
              touch.y_raw
              );
    # Wake up on touch
    on_release:
      - if:
          condition:
            lvgl.is_paused:
          then:
            - logger.log: "Touch detected while asleep. Waking up display..."
            - output.turn_on: backlight
            - lvgl.resume:
            - lvgl.widget.redraw:

########################
# RGB LED
########################

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO${rgb_led_pin}
    num_leds: 1
    chipset: ws2812
    name: "Status LED"
    id: my_status_led
    
    # Optional: Add some fun effects
    effects:
      - addressable_rainbow:
          name: Rainbow
      - pulse:
          name: Slow Pulse
          
########################
# 5 Aircon Zone Control
########################

script:
  - id: change_climate_action
    mode: parallel
    parameters:
      target_temp: float
      climate_entity: string
      temp_change: float
    then:
      - if:
          condition:
            lambda: return !std::isnan(target_temp);
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: !lambda return climate_entity;
                  temperature: !lambda return target_temp + temp_change;
  
  - id: zone_on_off_action
    mode: parallel
    parameters:
      turn_on: bool
      climate_entity: string
    then:
      - if:
          condition:
            lambda: 'return turn_on;'
          then:
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: !lambda 'return climate_entity;'
                  hvac_mode: cool
          else:
            - homeassistant.action:
                action: climate.turn_off
                data:
                  entity_id: !lambda 'return climate_entity;'
                  
font:
  - file: "gfonts://Roboto"
    id: ui_font
    size: 16

# Very basic demo UI
lvgl:
        
  rotation: 90

  # SLEEP ACTION
  on_idle:
    - timeout: 60s
      then:
        - output.turn_off: backlight
        - lvgl.pause:

  widgets:
    # ----------------------------------------------------
    # MAIN GRID CONTAINER (Vertical Stack for 5 Zones)
    # ----------------------------------------------------
    - obj:
        id: climate_panel
        width: 100%
        height: 100%
        layout: vertical
        pad_all: 1
        
        widgets:
          # ====================================================
          # ROOM 1
          # ====================================================
          - obj:
              width: 100%
              height: 46
              layout: horizontal
              pad_all: 2
              widgets:
                - label:
                    text: "Room 1"
                    width: 60
                    height: 100%
                    pad_top: 10
                    text_font: ui_font
                    align: CENTER
                    text_align: LEFT
                - label:
                    id: room1_act_deg
                    text: "r1°"
                    width: 45
                    height: 100%
                    pad_top: 10
                    text_font: ui_font
                    align: CENTER
                    text_align: CENTER
                - switch:
                    id: room1_on_off
                    pad_right: 5
                    height: 30
                    width: 45
                    on_change:
                      then:
                        script.execute:
                          id: zone_on_off_action
                          turn_on: !lambda 'return x;'
                          climate_entity: "${ha_climate_room1}"
                - button:
                    id: room1_set_up
                    align: CENTER
                    height: 30
                    width: 45
                    widgets:
                      - label:
                          text: "+"
                          align: CENTER
                          text_align: CENTER
                    on_click:
                      script.execute:
                        id: change_climate_action
                        target_temp: !lambda 'return id(room1_target_temp).state;'
                        climate_entity: "${ha_climate_room1}"
                        temp_change: ${temp_increase}
                - label:
