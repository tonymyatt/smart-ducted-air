########################
# Home Assitant Integrations
########################

# Expose control of the speaker and backlight
switch:
  - platform: output
    name: "Speaker Amplifier"
    output: speaker_amp_enable
    restore_mode: ALWAYS_ON
  - platform: output
    name: "Backlight"
    output: backlight
    restore_mode: ALWAYS_ON