text_sensor:
  - platform: homeassistant
    id: climate1_state
    entity_id: ${ha_climate_room1}
    internal: true
    on_value:
      then:
        - lvgl.switch.update:
            id: room1_on_off
            state:
              checked: &button_checked_logic !lambda 'return x != "off";'
            indicator:
              checked:
                bg_color: &switch_color_logic !lambda |-
                  if (x == "heat") {
                    return ${lv_color_red}
                  } else {
                    return ${lv_color_blue}
                  }              
        - lvgl.label.update:
            id: room1_set_deg
            text_color: &settext_color_logic !lambda |-
                  if (x != "off") {
                    return ${lv_color_black}
                  } else {
                    return ${lv_color_lightgrey}
                  }
        - lvgl.button.update:
            id: room1_set_down
            bg_color: &setbutton_color_logic !lambda |-
                  if (x == "heat") {
                    return ${lv_color_red}
                  } else if (x == "cool") {
                    return ${lv_color_blue}
                  } else {
                    return ${lv_color_lightgrey}
                  }
        - lvgl.button.update:
            id: room1_set_up
            bg_color: *setbutton_color_logic

  - platform: homeassistant
