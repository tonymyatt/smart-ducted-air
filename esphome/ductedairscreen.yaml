substitutions:
  sda_pin_bus: "16"         # I2C Bus A SDA
  scl_pin_bus: "15"         # I2C BUS A SCL
  
  i2s_lrclk_pin: "7"        # I2S LRCLK (Word Select)
  i2s_bclk_pin: "5"         # I2S BCLK (Bit Clock)
  i2s_mclk_pin: "4"         # I2S MCLK (Master Clock)
  i2s_din_pin: "6"          # I2S Data In (Mic)
  i2s_dout_pin: "8"         # I2S Data Out (Speaker)
  
  spi_clk_pin: "12"         # SPI CLK Pin
  spi_mosi_pin: "11"        # SPI MOSI PIN
  spi_miso_pin: "13"        # SPI MISO PIN
  
  backlight_pin: "45"       # Display backlight
  
  speaker_enable_pin: "1"   # Speaker Enable
  
  battery_level_pin: "9"    # Battery level
  
  rgb_led_pin: "42"    

  ha_climate_room1: climate.garage_ductedairroof_room1_ducted_air
  ha_climate_room2: climate.garage_ductedairroof_room2_ducted_air
  ha_climate_room3: climate.garage_ductedairroof_room3_ducted_air
  ha_climate_room4: climate.garage_ductedairroof_room4_ducted_air
  ha_climate_room5: climate.garage_ductedairroof_room5_ducted_air

  temp_decrease: -0.1
  temp_increase: 0.1

  lv_color_red: lv_color_hex(0xa91b0d);
  lv_color_blue: lv_color_hex(0x007BFF);
  lv_color_lightgrey: lv_color_hex(0xD3D3D3);
  lv_color_black: lv_color_hex(0x000000);

esphome:
  name: ductedairscreen
  friendly_name: Ducted Air Panel
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_psram: true # offload network buffers to psram
  ap:
    ssid: DuctedAirScreen Fallback Hotspot
    password: !secret wifi_fallback

# Enable PSRAM 
psram:
  mode: octal
  speed: 80MHz         
    
captive_portal:

########################
# I/O && Bus definitions
########################

i2c:
  - id: bus
    sda: GPIO${sda_pin_bus}
    scl: GPIO${scl_pin_bus}
    scan: true
    
spi:
  clk_pin: GPIO${spi_clk_pin}
  mosi_pin: GPIO${spi_mosi_pin}
  miso_pin: GPIO${spi_miso_pin}

output:
  - platform: gpio
    pin: GPIO${speaker_enable_pin}
    id: speaker_amp_enable
    inverted: true
  - platform: gpio
    pin: GPIO${backlight_pin}
    id: backlight
  - platform: gpio
    pin: GPIO2
    id: boiler_output

sensor:
  - platform: adc
    pin: GPIO${battery_level_pin}
    name: "Battery Level"
    update_interval: 60s
    
  - platform: homeassistant
    id: room1_actual_temp
    entity_id: ${ha_climate_room1}
    attribute: current_temperature
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: room1_act_deg
            text: &label_temperature_logic !lambda 'return str_snprintf("%.1f°", 6, x);'

  - platform: homeassistant
    id: room1_target_temp
    entity_id: ${ha_climate_room1}
    attribute: temperature
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: room1_set_deg
            text: *label_temperature_logic
    
